name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run knip
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps webkit
      # The suite replays the finished 2025 race. The anonymized fixtures carry
      # the real timestamps, so they stand in for the private exports here.
      - run: |
          mkdir -p .data/history
          for year in 2023 2024 2025; do cp "tests/fixtures/history-$year.csv" ".data/history/$year.csv"; done
      - run: bun run e2e
        env:
          HISTORY_DOWNLOAD: "off"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
