name: Deploy to k3s

# Build the image, push it to GHCR, then join the home tailnet and roll it out
# to the k3s cluster (t1/t2/t3). Public traffic reaches the cluster through the
# in-cluster Cloudflare tunnel; nothing here is exposed to the internet.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-k3s
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push ghcr.io/matsubo/sado-tracker-2026

env:
  IMAGE: ghcr.io/matsubo/sado-tracker-2026

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: true
          # Inlined into the client bundle at build time (see Dockerfile).
          build-args: |
            NEXT_PUBLIC_GA_ID=G-2J16EMZ73S
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Joins as an ephemeral tag:ci node. The tailnet policy lets tag:ci reach
      # only the Tailscale Service svc:k3s-api (100.86.55.136:6443, the server in
      # KUBECONFIG), so the tailnet's DNS (AdGuard on n4) is out of reach: keep
      # the runner's own resolver with --accept-dns=false.
      # Tailnet Lock (since 2026-10-26): a node made through the OIDC trust
      # credential is unsigned and reaches nothing, so the job joins with
      # TS_AUTHKEY, an auth key (tag:ci, reusable, ephemeral, pre-approved)
      # signed with a trusted Tailnet Lock key. It expires 2027-01-26; renewal:
      # matsubo/network-setting tailscale/README.md.
      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          statedir: /tmp/tailscale-state/
          args: --accept-dns=false

      # kubectl comes with the ubuntu-latest runner image.

      # KUBECONFIG is the sado-tracker-2026/deployer ServiceAccount: it can only
      # manage the Deployment, Service and Ingress in namespace sado-tracker-2026.
      - name: Roll out
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          sed "s|image: IMAGE$|image: $IMAGE:$GITHUB_SHA|" deploy/k8s.yaml | kubectl apply -f -
          kubectl -n sado-tracker-2026 rollout status deploy/sado-tracker-2026 --timeout=600s
